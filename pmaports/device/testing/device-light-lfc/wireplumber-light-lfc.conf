# L16: no PipeWire cameras. The camera modules are only usable through Viewfinder (l16-camera);
# WirePlumber's monitors opened them too, which kept the driver from powering them down and
# left Viewfinder's preview stuck after a crash.
wireplumber.profiles = {
  main = {
    monitor.libcamera = disabled
    monitor.v4l2 = disabled
  }
}

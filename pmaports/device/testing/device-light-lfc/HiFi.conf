# Use case configuration for the Light L16 (WCD9335 on SLIMbus 0).
# Speaker path as stock (tinymix while playing): SLIMBUS_0_RX -> SLIM RX0 -> RX INT3
# (COMP3) -> LINEOUT1 -> speaker amplifier (PMI8994 GPIO 2, switched by the kernel).
# Mics as stock (tinymix while recording video): DMIC2 (back) -> DEC7 -> SLIM TX7 and
# DMIC0 (front) -> DEC8 -> SLIM TX8, SLIMBUS_0_TX -> MultiMedia2. The DMICs pull in
# MIC BIAS1 and the codec MCLK through the DT routing.

# All routing is part of the verb, as on DB820c: PulseAudio opens the PCMs while
# probing the verb, before enabling any device. A frontend without a backend fails to
# open (EINVAL), and so does a capture whose SLIM TX ports have no decimator selected.
SectionVerb {
	EnableSequence [
		cset "name='SLIM RX0 MUX' AIF1_PB"
		cset "name='SLIM RX1 MUX' AIF1_PB"
		cset "name='SLIMBUS_0_RX Audio Mixer MultiMedia1' 1"

		cset "name='DMIC MUX7' DMIC2"
		cset "name='ADC MUX7' DMIC"
		cset "name='SLIM TX7 MUX' DEC7"
		cset "name='DMIC MUX8' DMIC0"
		cset "name='ADC MUX8' DMIC"
		cset "name='SLIM TX8 MUX' DEC8"
		cset "name='AIF1_CAP Mixer SLIM TX7' 1"
		cset "name='AIF1_CAP Mixer SLIM TX8' 1"
		cset "name='MultiMedia2 Mixer SLIMBUS_0_TX' 1"
	]

	# Left in place: PulseAudio disables the verb between probing the speaker and the
	# mic, and the mic probe would then find no backend.
	DisableSequence [
	]
}

SectionDevice."Speaker" {
	Comment "Speaker"

	# Left (RX0) on the INT3_2 path as stock (gain: RX3 Mix Digital Volume), right
	# (RX1) on the INT3_1 main mixer (gain: RX3 Digital Volume); RX INT3 INTERP sums
	# them (MIX2). Both gains run -84..+40 dB (84 = 0 dB) and anything above 0 dB
	# clips, so both stay fixed at -12 dB (headroom for summing L+R, and a comfortable
	# maximum) and PulseAudio uses software volume (no PlaybackMixerElem).
	EnableSequence [
		cset "name='RX INT3_2 MUX' RX0"
		cset "name='RX INT3_1 MIX1 INP0' RX1"
		cset "name='RX INT3_1 MIX1 INP1' ZERO"
		cset "name='COMP3 Switch' 1"
		## -12 dB (user: 80% at -6 dB was the most that was comfortable; at -9 dB it
		## clipped above 90%)
		cset "name='RX3 Mix Digital Volume' 72"
		cset "name='RX3 Digital Volume' 72"
	]

	DisableSequence [
		cset "name='RX INT3_2 MUX' ZERO"
		cset "name='RX INT3_1 MIX1 INP0' ZERO"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}

# Stereo: left = back mic, right = front mic (pmos/pulse/l16-mics.pa splits them).
SectionDevice."Mic" {
	Comment "Microphones"

	EnableSequence [
		## +24 dB: at 0 dB speech was ~-50 dBFS; +20 dB gave -33..-27 dBFS at arm's length,
		## +30 dB clipped speech close to the camera (DEC controls: L16 patch)
		cset "name='DEC7 Volume' 108"
		cset "name='DEC8 Volume' 108"
	]

	DisableSequence [
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
	}
}

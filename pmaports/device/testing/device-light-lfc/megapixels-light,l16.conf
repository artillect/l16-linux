Version = 1;
Make: "Light";
Model: "L16";

// The light-ccb driver boots the camera ASICs and starts their preview when the stream
// starts: ASIC1's preview (A1, 28 mm; B4 or C5 through the driver's preview_module
// control) at 2080x1560 RAW10 on CSIPHY0. Full-resolution photos: l16-capture.
// The data is GRBG, labelled GBRG: Megapixels' debayer reads the pattern one pixel off
// diagonally here (red and blue swapped otherwise); light-ccb accepts the label.
Rear: {
    SensorDriver: "light-ccb";
    BridgeDriver: "qcom-camss";

    Modes: (
        {
            Width: 2080;
            Height: 1560;
            Rate: 30;
            Format: "GBRG10p";
            Rotate: 270;

            Pipeline: (
                {Type: "Link", From: "msm_csiphy0", FromPad: 1, To: "msm_csid0", ToPad: 0},
                {Type: "Link", From: "msm_csid0", FromPad: 1, To: "msm_ispif0", ToPad: 0},
                {Type: "Link", From: "msm_ispif0", FromPad: 1, To: "msm_vfe0_rdi0", ToPad: 0},
                {Type: "Mode", Entity: "light-ccb"},
                {Type: "Mode", Entity: "msm_csiphy0"},
                {Type: "Mode", Entity: "msm_csid0"},
                {Type: "Mode", Entity: "msm_ispif0"},
                {Type: "Mode", Entity: "msm_vfe0_rdi0"}
            );
        }
    );
};

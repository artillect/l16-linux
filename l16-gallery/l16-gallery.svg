<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <!-- one landscape; each print shows its part of it, as the L16 tiles its frames -->
    <g id="land">
      <rect x="0" y="0" width="128" height="128" fill="#99c1f1"/>
      <circle cx="90" cy="30" r="8" fill="#f6d32d"/>
      <path d="M0 70 L30 40 L48 58 L70 34 L100 64 L128 50 V128 H0 Z" fill="#3584e4"/>
      <path d="M0 80 Q40 62 70 78 T128 74 V128 H0 Z" fill="#57e389"/>
      <path d="M0 96 Q60 82 128 100 V128 H0 Z" fill="#26a269"/>
    </g>
    <clipPath id="tl"><rect x="23" y="18" width="38" height="36"/></clipPath>
    <clipPath id="tr"><rect x="67" y="18" width="38" height="36"/></clipPath>
    <clipPath id="bl"><rect x="23" y="64" width="38" height="36"/></clipPath>
    <clipPath id="br"><rect x="67" y="64" width="38" height="36"/></clipPath>
    <clipPath id="c"><rect x="45" y="41" width="38" height="36"/></clipPath>
  </defs>
  <g transform="translate(64 64) scale(1.12) translate(-64 -64)">
    <g transform="rotate(-6 42 41)">
      <rect x="17" y="13" width="50" height="58" rx="3" fill="#241f31" opacity="0.35"/>
      <rect x="19" y="14" width="46" height="54" rx="2" fill="#f6f5f4"/>
      <use href="#land" clip-path="url(#tl)"/>
    </g>
    <g transform="rotate(5 86 41)">
      <rect x="61" y="13" width="50" height="58" rx="3" fill="#241f31" opacity="0.35"/>
      <rect x="63" y="14" width="46" height="54" rx="2" fill="#f6f5f4"/>
      <use href="#land" clip-path="url(#tr)"/>
    </g>
    <g transform="rotate(4 42 87)">
      <rect x="17" y="59" width="50" height="58" rx="3" fill="#241f31" opacity="0.35"/>
      <rect x="19" y="60" width="46" height="54" rx="2" fill="#f6f5f4"/>
      <use href="#land" clip-path="url(#bl)"/>
    </g>
    <g transform="rotate(-5 86 87)">
      <rect x="61" y="59" width="50" height="58" rx="3" fill="#241f31" opacity="0.35"/>
      <rect x="63" y="60" width="46" height="54" rx="2" fill="#f6f5f4"/>
      <use href="#land" clip-path="url(#br)"/>
    </g>
    <g transform="rotate(-2 64 64)">
      <rect x="39" y="36" width="50" height="58" rx="3" fill="#241f31" opacity="0.35"/>
      <rect x="41" y="37" width="46" height="54" rx="2" fill="#f6f5f4"/>
      <use href="#land" clip-path="url(#c)"/>
    </g>
  </g>
</svg>

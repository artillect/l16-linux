# Build the L16 packages with pmbootstrap and publish them to the apk repository
# (gh-pages). Run by hand with a release tag to also build the image and publish a
# GitHub release, with notes from releases/<tag>.md.
name: Build

on:
  push:
    branches: [main]
    paths:
      - "pmaports/**"
      - "kernel/**"
      - "l16-render/**"
      # our programs' sources, which pmaports/sync.sh packs into their packages
      - "l16-camera/**"
      - "l16-gallery/**"
      - "glycin-lri/**"
      - "l16-gnss/**"
      - "l16-phosh/**"
      - "tools/l16-shoot"
      - "tools/l16-lri-assemble"
      - "tools/ci/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      release:
        description: "Release tag (notes from releases/<tag>.md); leave empty to only publish packages"
        required: false
        default: ""
      prerelease:
        description: "Mark the release as a pre-release"
        type: boolean
        default: true

permissions:
  contents: write

# one build at a time: they all push gh-pages
concurrency:
  group: build
  cancel-in-progress: false

jobs:
  # l16-render is an Android program (it runs Light's renderer from the stock partitions):
  # built with the NDK, which has no aarch64 Linux build, on x86
  render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build l16-render
        env:
          NDK_VERSION: "30.0.15729638"
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null
          NDK="$ANDROID_HOME/ndk/$NDK_VERSION"
          # linked against the NDK's C++ runtime; the camera runs it with the stock gallery's
          NDK="$NDK" sh l16-render/build.sh "$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android"

      - uses: actions/upload-artifact@v4
        with:
          name: l16-render
          path: l16-render/build/l16-render

  build:
    needs: render
    # native aarch64: the kernel builds without emulation
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          # the whole history: the changelog is made from it
          fetch-depth: 0

      - name: Check the release notes
        if: inputs.release != ''
        run: test -f "releases/${{ inputs.release }}.md"

      - uses: actions/download-artifact@v4
        with:
          name: l16-render
          path: l16-render/build

      - name: Set up pmbootstrap
        env:
          APK_SIGNING_KEY: ${{ secrets.APK_SIGNING_KEY }}
        run: |
          sh tools/ci/setup.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # this build's l16-render, not the one the repository's checksum is for (only
          # built when its version changed: the published one is used otherwise)
          "$HOME/.local/bin/pmbootstrap" checksum l16-render

      # only the packages whose version changed are built; the others come from gh-pages
      - name: Seed with the published packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: sh tools/ci/seed-packages.sh

      - name: Build packages
        run: pmbootstrap -y build linux-light-lfc device-light-lfc chiaro libcamera iio-sensor-proxy phoc geoclue phosh l16-camera glycin-lri l16-render l16-gallery l16-phosh-plugins l16-gnss

      - name: Publish packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: sh tools/ci/publish-packages.sh

      - name: Build and publish the release
        if: inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh tools/ci/release.sh "${{ inputs.release }}" "${{ inputs.prerelease }}"

      - name: pmbootstrap log
        if: failure()
        run: tail -n 200 "$HOME/.local/var/pmbootstrap/log.txt" || true

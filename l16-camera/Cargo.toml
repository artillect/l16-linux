[package]
name = "l16-camera"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Camera app for the Light L16 on Linux, after OpenLight's layout"

[dependencies]
gtk = { package = "gtk4", version = "0.10", features = ["v4_12"] }
gst = { package = "gstreamer", version = "0.24" }
libc = "0.2"

[profile.release]
opt-level = 2
